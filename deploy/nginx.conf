# ClassO production nginx config.
# Serves the built SPA and reverse-proxies the Go backend (same container).

# ModelScope `docker` mode requires the container to listen on 0.0.0.0:7860.
# The Go backend runs on an internal port (8081) and is never exposed directly.
server {
    listen       7860;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Gzip already-tiny static assets (JS/CSS/SVG/json/fonts).
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # API: forward to the Go backend running locally on :8081.
    location /v1/ {
        proxy_pass         http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /healthz {
        proxy_pass         http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    # Server-Sent Events stream: disable buffering so typing/messages push live.
    location /v1/groups/ {
        proxy_pass         http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
    }

    # Hashed build assets: cache aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: unknown paths serve index.html so client-side routes work.
    location / {
        try_files $uri $uri/ /index.html;
    }
}